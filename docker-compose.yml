services:
  db:
    image: mariadb:11
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: cloudstorage
      MARIADB_USER: clouduser
      MARIADB_PASSWORD: cloudpass

    volumes:
      - ${DATA_DIR:-/opt/cloudstorage/data}/mariadb_data:/var/lib/mysql

    ports:
      - "3306:3306"

  mail:
    build: ./mail-service-go
    restart: unless-stopped
    environment:
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_WORKERS: ${MAIL_WORKERS}
      SERVER_PORT: "8081"
      AUTH_TOKEN: ${MAIL_AUTH_TOKEN}
      LANGUAGE: ${MAIL_LANGUAGE:-zh}

  redis:
    image: redis:7-alpine

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/cloudstorage
      DB_DRIVER: org.mariadb.jdbc.Driver
      DB_USERNAME: clouduser
      DB_PASSWORD: cloudpass
      DATA_DIR: /app/data
      STORAGE_ROOT: /app/data/storage
      MAIL_SERVICE_URL: http://mail:8081/send
      MAIL_AUTH_TOKEN: ${MAIL_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    volumes:
      - ${DATA_DIR:-/opt/cloudstorage/data}/storage:/app/data/storage

    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

# == Application ==
spring.application.name=cloudstorage
server.port=8080

# == Database == 

# H2 
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/cloudstorage;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.h2.console.enabled=false

# PostgreSQL 
# spring.datasource.url=jdbc:postgresql://localhost:5432/cloudstorage
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MariDB
# spring.datasource.url=jdbc:mariadb://localhost:3306/cloudstorage
# spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# == JPA ==
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# == FileUpdate ==
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== 邮件（填空，部署时配） =====
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enabled=true

# ===== 密码找回 =====
cloudstorage.password-reset.token-expiration-minutes=30
cloudstorage.mail.service-url=${MAIL_SERVICE_URL:http://localhost:8081/send}
cloudstorage.mail.auth-token=${MAIL_AUTH_TOKEN:dev-token}
cloudstorage.mail.reset-password-subject=${MAIL_RESET_SUBJECT:密码重置通知 - CloudStorage}

# ===== 自定义配置 =====
cloudstorage.storage.root=${STORAGE_ROOT:./storage}
cloudstorage.jwt.secret=${JWT_SECRET:ChangeMeToA256BitSecret!!!!!!!!!!!!!!!!!}
cloudstorage.jwt.expiration-hours=2
cloudstorage.login.max-attempts=5
cloudstorage.login.lockout-minutes=15
cloudstorage.captcha.expiration-minutes=5
cloudstorage.share.default-expiration-hours=72

spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-private=true

# logging.level.org.springframework.security=DEBUG
# == Application ==
spring.application.name=cloudstorage
server.port=8080

# == Database == 
spring.datasource.url=jdbc:h2:file:./data/cloudstorage;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# == JPA ==
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# == FileUpdate ==
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== 邮件（填空，部署时配） =====
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enabled=true

# ===== 自定义配置 =====
cloudstorage.storage.root=./storage
cloudstorage.jwt.secret=ChangeMeToA256BitSecret!!!!!!!!!!!!!!!!!
cloudstorage.jwt.expiration-hours=2
cloudstorage.login.max-attempts=5
cloudstorage.login.lockout-minutes=15
cloudstorage.captcha.expiration-minutes=5
cloudstorage.share.default-expiration-hours=72

logging.level.org.springframework.security=DEBUG